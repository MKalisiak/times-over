<main>
  <h1 class="top">Type in your<br>entries</h1>
  <form class="card" [formGroup]="entryForm" (ngSubmit)="saveEntry()" autocomplete="off">
    <div class="counter"><span class="eyebrow">Entries</span><span class="num">{{ numberOfEntries() }}</span></div>
    <label for="entry">Your entry</label>
    <input class="input" id="entry" formControlName="entry" [class.invalid]="error"
           [attr.aria-invalid]="!!error" [attr.aria-describedby]="error ? 'entry-error' : null">
    <p class="error" id="entry-error" role="alert" *ngIf="error">{{ error }}</p>
    <button class="primary" type="submit">Save</button>
  </form>
  <div class="push" *ngIf="numberOfEntries() > 0">
    <button class="alt" (click)="continueToTeams()">Enough</button>
    <button class="link" (click)="onClearClicked()">Clear</button>
  </div>
</main>
