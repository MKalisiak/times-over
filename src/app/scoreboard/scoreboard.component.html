<main class="hero">
  <h1 class="top">{{ 'scores.title' | translate: { number: currentRound + 1 } }}</h1>

  <div class="card score-scroll">
  <table class="scores">
    <tr>
      <th></th>
      <th *ngFor="let name of teamNames">
        {{ name }}
      </th>
    </tr>
    <tr *ngFor="let round of scores; let i = index">
      <td><strong>{{ 'game.round' | translate: { number: i + 1 } }}</strong></td>
      <td *ngFor="let score of round">
        {{ score != null ? score : '-' }}
      </td>
    </tr>
    <tr>
      <td><strong>{{ 'scores.total' | translate }}</strong></td>
      <td *ngFor="let total of totals">{{ total }}</td>
    </tr>
  </table>
  </div>

  <div class="push"><button class="primary"
    (click)="nextRound()">{{ (isLastRound() ? 'scores.end' : 'scores.next') | translate }}</button></div>
</main>
