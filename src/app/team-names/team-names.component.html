<main>
  <h1 class="top">{{ 'teams.title' | translate }}</h1>
  <form id="team-names" class="card" (ngSubmit)="startGame()" autocomplete="off">
    <div class="team-field" *ngFor="let name of names; let i = index">
      <label [attr.for]="'team-' + i">{{ 'teams.numbered' | translate: { number: i + 1 } }}</label>
      <input class="input" [id]="'team-' + i" [formControl]="name" [placeholder]="'teams.numbered' | translate: { number: i + 1 }">
    </div>
  </form>
  <div class="push"><button class="primary" type="submit" form="team-names">{{ 'teams.continue' | translate }}</button></div>
</main>
