<main>
  <h1 class="top">Settings</h1>
  <form [formGroup]="settingsForm">
    <label for="numberOfTeams">Number of teams</label>
    <input class="field" id="numberOfTeams" type="number" formControlName="numberOfTeams">
    <label for="numberOfRounds">Number of rounds</label>
    <input class="field" id="numberOfRounds" type="number" formControlName="numberOfRounds">
    <label for="secondsPerTry">Seconds per try</label>
    <input class="field" id="secondsPerTry" type="number" formControlName="secondsPerTry">
    <label id="policy-label">Duplicate policy</label>
    <mat-select class="field select" aria-labelledby="policy-label" panelClass="policy-options"
                formControlName="duplicatePolicy">
      <mat-option *ngFor="let policy of duplicatePolicyView" [value]="policy.value">{{ policy.name }}</mat-option>
    </mat-select>
  </form>
  <div class="push"><a class="action primary" routerLink="/">Home</a></div>
</main>
